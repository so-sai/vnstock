[package]
name = "minh_chung"
version = "0.2.0"
edition = "2021"
authors = ["PTCK_VNSTOCK Team"]
description = "Native High-Speed (<30ms) Zalo PC Quant Assistant with rusqlite (bundled + FTS5)"

[[bin]]
name = "minh_chung"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
# [WHY] Tràn số phải panic thay vì wrap im lặng. Binary này tính lot size/giá trị lệnh từ số
# thực của người dùng và số dư: một lần wrap cho ra con số "hợp lệ" nhưng sai — đúng lớp lỗi
# in-band (giá trị dữ liệu hợp lệ mang nghĩa lỗi) mà sự cố musl/OpenSSH đã chứng minh.
overflow-checks = true
