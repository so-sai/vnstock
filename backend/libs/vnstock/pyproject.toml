[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vnstock"
version = "4.0.5"
description = "vnstock fork (PTCK-VN patched) — vendored as editable local package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.20",
    "requests>=2.20",
]

[tool.setuptools]
# Package root = backend/libs/vnstock; ships both `vnstock/` and `vnai.py`
# (quote.py does `from vnai import optimize_execution`).
packages = { find = { where = ["."] } }
py-modules = ["vnai"]

[tool.setuptools.package-data]
"*" = ["*.json"]
