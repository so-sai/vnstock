[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnstock"
version = "3.5.0"
description = "A beginner-friendly yet powerful Python toolkit for financial analysis and automation — built to make modern investing accessible to everyone"
readme = "README.md"
authors = [
  { name = "Thinh Vu", email = "support@vnstocks.com" },
]
license = { text = "Custom: Personal, research, non-commercial; contact support@vnstocks.com for other use" }
requires-python = ">=3.10"
keywords = ["vnstock", "finance", "vietnam", "stock market", "analysis", "API"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
    "Natural Language :: Vietnamese",
    "Natural Language :: English",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "seaborn",
    "openpyxl",
    "pydantic",
    "pytz",
    "psutil",
    "packaging>=20.0",
    "importlib-metadata>=1.0",
    "tenacity",
    "vnai>=2.3.9",
    "vnstock_ezchart>=0.0.3",
    "python-dotenv",
    "fake-useragent>=1.5.1",
    "cryptography>=42.0.5",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-timeout", "ruff>=0.9.4"]

[project.urls]
Documentation = "https://vnstocks.com/docs"
Source = "https://github.com/thinh-vu/vnstock"
IssueTracker = "https://github.com/thinh-vu/vnstock/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
vnstock = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
vnstock = ["docs/*.txt", "docs/*.csv"]

# ==============================================================================
# 🎯 RUFF (BỘ QUẢN GIA SIÊU TỐC: Linter & Formatter)
# ==============================================================================
[tool.ruff]
line-length = 127
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"] # Basic errors, forensics, imports, warnings
ignore = [
    "E402", # Cho phép import sau sys.path.insert (Dành cho main.py và vendor)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# 🧪 PYTEST (CẤU HÌNH THỬ NGHIỆM)
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests - fast, isolated tests",
    "integration: Integration tests - may call external services",
    "slow: Slow tests - may take >5 seconds",
    "api: Tests for API layer",
    "explorer: Tests for explorer modules",
    "vci: Tests specific to VCI data source",
    "tcbs: Tests specific to TCBS data source",
    "kbs: Tests specific to KBS data source",
    "smoke: Smoke tests - basic functionality checks",
    "regression: Regression tests for fixed bugs",
]

# ==============================================================================
# 📊 COVERAGE (BÁO CÁO ĐỘ PHỦ CODE)
# ==============================================================================
[tool.coverage.run]
source = ["vnstock"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
skip_covered = false
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "@runtime_checkable",
]

# ==============================================================================
# 🛡️ MYPY (KIỂM TRA KIỂU DỮ LIỆU)
# ==============================================================================
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
