[package]
name = "ptck_core"
version = "0.1.0"
edition = "2021"
description = "PTCK native compute core — Hybrid 20% (PyO3 + Rayon + NumPy)"
license = "MIT"

[lib]
name = "ptck_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
rayon = "1.11"
