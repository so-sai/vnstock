# SYSTEM MANIFEST v1
# ==================
# Đây là nguồn chân lý duy nhất cho mọi entrypoint.
# Mọi automation / Agent / Operator PHẢI đọc file này trước
# và chỉ gọi CLI — không viết script tạm.
#
# Quy tắc:
#   1. Tra manifest → tìm cli tương ứng
#   2. Gọi CLI với đúng arguments
#   3. Nếu CLI không tồn tại → mới fallback import trực tiếp
#      và báo cáo vào .kit/friction để bổ sung manifest

version: 1.0
project: PTCK_VNSTOCK

entrypoints:

  # ── Thị trường ──────────────────────────────────────
  market_snapshot:
    description: "Snapshot tổng quan thị trường (regime + breadth + flow + gold)"
    cli: "python ptck.py market"
    category: market

  regime_check:
    description: "Phân tích regime chi tiết (điểm, driver, ATR, ADX)"
    cli: "python ptck.py regime"
    category: market

  # ── Báo cáo ─────────────────────────────────────────
  report_weekly:
    description: "Báo cáo nhận thức hàng tuần (cognitive report)"
    cli: "python ptck.py report weekly"
    category: report

  report_daily:
    description: "Báo cáo thị trường hằng ngày (5 phần, thuần Việt)"
    cli: "python ptck.py report daily"
    category: report

  report_monthly:
    description: "Báo cáo thị trường hàng tháng"
    cli: "python ptck.py report monthly --month YYYY-MM [--lang vi]"
    category: report

  # ── Daily ────────────────────────────────────────────
  daily_close:
    description: "Chạy daily closer (breadth + sector + flow + macro + reputation)"
    cli: "python ptck.py daily-close"
    category: daily

  daily_update:
    description: "Cập nhật dữ liệu EOD (OHLCV, breadth, sector, macro)"
    cli: "python ptck.py daily-update [--date YYYY-MM-DD] [--batch-size N] [--throttle S]"
    category: daily

  # ── Telemetry ────────────────────────────────────────
  reputation_view:
    description: "Xem reputation ledger + drift monitor của các driver"
    cli: "python ptck.py telemetry reputation"
    category: telemetry

  reputation_refresh:
    description: "Refresh reputation ledger từ shadow metrics + alpha attribution"
    cli: "python ptck.py telemetry reputation --refresh"
    category: telemetry

  drift_monitor:
    description: "Drift Monitor — độ dốc hiệu suất, half-life, cảnh báo mất hiệu lực"
    cli: "python ptck.py telemetry reputation --drift"
    category: telemetry

  shadow_metrics:
    description: "Xem shadow metrics (accuracy, drift, early warning)"
    cli: "python ptck.py telemetry shadow [--days N]"
    category: telemetry

  # ── Server ───────────────────────────────────────────
  serve:
    description: "Khởi động FastAPI server + frontend"
    cli: "python ptck.py serve"
    category: server

  # ── Database ─────────────────────────────────────────
  db_vacuum:
    description: "Bảo trì database (VACUUM, compact)"
    cli: "python ptck.py db vacuum"
    category: database

  db_stats:
    description: "Thống kê database (dung lượng, số dòng mỗi bảng)"
    cli: "python ptck.py db stats"
    category: database

  db_optimize:
    description: "Tối ưu hóa toàn bộ database (JSONB + STRICT + VACUUM)"
    cli: "python ptck.py db optimize"
    category: database

  db_backup:
    description: "Database Guardian — Integrity Check + Online Backup + Retention (rolling 7-day)"
    cli: "python ptck.py db backup [--dry-run]"
    category: database

  structural_check:
    description: "Bộ phát hiện lệch cấu trúc thị trường (3 trụ: lan tỏa, đồng thuận ngành, index vs nội bộ)"
    cli: "python ptck.py structural [--date YYYY-MM-DD]"
    category: market

  confidence_layer:
    description: "Lớp tự đánh giá độ tin cậy — confidence score + breakdown 5 nhân tố (regime, cấu trúc, đồng thuận, biến động, uy tín driver)"
    cli: "python ptck.py confidence"
    category: decision

  final_decision:
    description: "Bộ não quyết định cuối cùng (hợp nhất regime + cấu trúc + cảnh báo)"
    cli: "python ptck.py final-decision [--date YYYY-MM-DD]"
    category: decision

  # ── Hệ thống ─────────────────────────────────────────
  status:
    description: "Kiểm tra sức khỏe hệ thống (env, dependencies, DB)"
    cli: "python ptck.py status"
    category: system

  scan:
    description: "Quét thị trường tìm cơ hội (elite scanner)"
    cli: "python ptck.py scan [--deep]"
    category: system

  # ── Operations (API) ────────────────────────────────────
  operations_daily_close:
    description: "API: Chốt phiên giao dịch (breadth + sector + flow + macro + reputation)"
    cli: "POST http://localhost:17039/api/operations/daily-close"
    category: operations

  operations_telemetry_drift:
    description: "API: Ghi log drift data (driver reputation + drift monitor)"
    cli: "POST http://localhost:17039/api/operations/telemetry-drift"
    category: operations

  # ── Gold ─────────────────────────────────────────────
  gold_dashboard:
    description: "Giá vàng SJC + BTMC + spread"
    cli: "python ptck.py gold"
    category: gold

  gold_regime:
    description: "Gold regime + cognitive signals + premium"
    cli: "python ptck.py gold regime"
    category: gold

  # ── Silver / Precious Metals ───────────────────────────
  silver_dashboard:
    description: "Giá bạc BTMC + XAGUSD + Gold/Silver Ratio"
    cli: "python ptck.py silver"
    category: precious_metals

  silver_gs_ratio:
    description: "Gold/Silver Ratio + regime classification"
    cli: "python ptck.py silver gs-ratio"
    category: precious_metals

  silver_seed:
    description: "Seed XAGUSD từ yfinance vào macro_history"
    cli: "python ptck.py silver seed"
    category: precious_metals

  # ── Snapshot ──────────────────────────────────────────
  snapshot:
    description: "Ảnh chụp thị trường duy nhất (regime + cấu trúc + cảnh báo + DDI + params_hash)"
    cli: "python ptck.py snapshot"
    category: market

  # ── Delta Divergence Index ────────────────────────────
  ddi_check:
    description: "Delta Divergence Index — Δ_SA = dS/dt - α·AC_latency, healilng illusion detector"
    cli: "python ptck.py ddi"
    category: decision

  # ── Snapshot Index ────────────────────────────────────
  snapshot_index:
    description: "Xem lịch sử snapshot_index.json — params_hash, regime, Δ_SA theo thời gian"
    cli: "python ptck.py snapshot-index [--limit N]"
    category: market

  # ── Index Decomposition ──────────────────────────────────
  index_decompose:
    description: "Phân tích chỉ số thị trường thống nhất — tách lớp chỉ số thật/ảo, đo độ méo, phát hiện tập trung"
    cli: "python ptck.py index-decompose [--date YYYY-MM-DD]"
    category: market

  # ── Group Influence ──────────────────────────────────────
  group_influence:
    description: "Bộ đo ảnh hưởng nhóm trụ — đóng góp VNINDEX theo nhóm, phát hiện thị trường ảo"
    cli: "python ptck.py group-influence"
    category: market

  # ── Data Quality (TẦNG 0) ──────────────────────────────
  data_quality:
    description: "Bộ đánh giá độ tin cậy dữ liệu (TẦNG 0) — số phiên, phân loại tin cậy, phát hiện mã thiếu lịch sử"
    cli: "python ptck.py data-quality"
    category: system

  # ── Backfill History ────────────────────────────────────
  backfill_history:
    description: "Engine khôi phục dữ liệu lịch sử (Backfill) — phục hồi dữ liệu cho mã thiếu lịch sử từ API, có dry-run mode"
    cli: "python ptck.py backfill-history [--symbols VCB,REE,HDB] [--start YYYY-MM-DD] [--end YYYY-MM-DD] [--dry-run] [--quiet]"
    category: system

  # ── Backfill Regime ────────────────────────────────────
  backfill_regime:
    description: "Backfill regime_history cho ngày thiếu — lấp khoảng trống thời gian trong DB"
    cli: "python ptck.py backfill-regime [--target YYYY-MM-DD] [--batch-size N]"
    category: system

  # ── RS Audit ───────────────────────────────────────────
  rs_audit:
    description: "Audit Top RS — phân tích nguồn gốc sức mạnh (nội tại vs dòng tiền vs tập trung vốn hóa)"
    cli: "python ptck.py rs-audit [--top N]"
    category: analysis

  # ── Strength Discrimination ────────────────────────────
  strength_discrimination:
    description: "Tầng Phân Tách Xung Lực — bóc tách RS nội tại vs ép trụ điều tiết chỉ số"
    cli: "python ptck.py strength-discrimination [--top N]"
    category: analysis

  # ── Flow Map ──────────────────────────────────────────
  flow_map:
    description: "Bản đồ Dòng vốn Liên thị trường 4 Tầng (Driver → Settlement → Reputation → Drift)"
    cli: "python ptck.py flow-map"
    category: analysis

  # ── Asia Rotation (Layer 2 Reference Frame) ────────────
  asia_rotation:
    description: "Góc xoay chuỗi cung ứng châu Á (Layer 2) — VN vs KOSPI+TAIEX+DXY, thay thế S&P 500 làm hệ quy chiếu chính"
    cli: "python ptck.py rotation"
    category: analysis

  # ── Phase 4 CAS-DSM ─────────────────────────────────────
  phase4:
    description: "Phase 4 CAS-DSM — Capitulation Detector: P_cap activation sensor + S_struct position scaler + Scale-In + Abortion Protocol"
    cli: "python ptck.py phase4"
    category: decision

  # ── Phase 4.2 — Break-Glass ─────────────────────────────
  break_glass_request:
    description: "Break-Glass: Yêu cầu override ticket (passphrase hoặc time-delay)"
    cli: "python ptck.py break-glass request [--delay]"
    category: emergency

  break_glass_verify:
    description: "Break-Glass: Xác thực ticket với passphrase"
    cli: "python ptck.py break-glass verify <ticket> --passphrase <KEY>"
    category: emergency

  break_glass_cancel:
    description: "Break-Glass: Hủy ticket"
    cli: "python ptck.py break-glass cancel <ticket>"
    category: emergency

  break_glass_status:
    description: "Break-Glass: Xem trạng thái portfolio critical lock"
    cli: "python ptck.py break-glass status"
    category: emergency

  # ── Phase 4.2 — Stale Manager ───────────────────────────
  stale_status:
    description: "StalePositionManager: Xem trạng thái stale layers + escrow cache"
    cli: "python ptck.py stale status"
    category: portfolio

  stale_writeoff:
    description: "StalePositionManager: Write-off LIFO — thanh lý campaign mới nhất trước"
    cli: "python ptck.py stale writeoff"
    category: portfolio

  stale_reclaim:
    description: "StalePositionManager: Reclaim một lớp stale"
    cli: "python ptck.py stale reclaim --campaign <id>"
    category: portfolio

  stale_escrow:
    description: "StalePositionManager: Xem escrow balance"
    cli: "python ptck.py stale escrow"
    category: portfolio

  # ── Phase 4.3 — TWAP Executor ──────────────────────────
  twap_plan:
    description: "TWAP: Xây dựng kế hoạch thanh lý stale positions"
    cli: "python ptck.py twap plan [--slices N]"
    category: execution

  twap_run:
    description: "TWAP: Thực thi một slice"
    cli: "python ptck.py twap run --slice N --price P"
    category: execution

  twap_status:
    description: "TWAP: Xem trạng thái thực thi"
    cli: "python ptck.py twap status"
    category: execution

  twap_resume:
    description: "TWAP: Resume sau mất mạng"
    cli: "python ptck.py twap resume"
    category: execution

  # ── Param Fingerprint Registry ───────────────────────────
  registry_view:
    description: "Sổ tay Dấu vân tay Tham số — tra cứu params_hash tốt nhất theo regime, kèm audit trail"
    cli: "python ptck.py registry [--regime RANGING] [--rebuild]"
    category: decision

  # ── Phase 5 — Paper Trading ───────────────────────────
  sandbox_dashboard:
    description: "Phase 5 Dashboard — Real-time Paper Trading Terminal (portfolio + orderbook + TWAP + slippage)"
    cli: "python ptck.py sandbox [--slices N] [--depth P] [--price P] [--capital P]"
    category: simulation

  phase5_simulation:
    description: "Phase 5 UAT — Paper Trading Simulation với Order Book Thinning + slippage Almgren-Chriss + storage sandboxing"
    cli: "python ptck.py phase5 [--slices N] [--depth P] [--price P]"
    category: simulation

  # ── Confidence ────────────────────────────────────────
  confidence:
    description: "Lớp tự đánh giá độ tin cậy — 5 nhân tố + veto"
    cli: "python ptck.py confidence"
    category: decision

  # ── Prediction Registry ──────────────────────────────────
  prediction_registry_log:
    description: "Ghi nhật ký dự báo RS Audit (phân loại 4 trụ) vào prediction_log.jsonl"
    cli: "python ptck.py prediction-registry log [--date YYYY-MM-DD]"
    category: telemetry

  prediction_registry_update:
    description: "Cập nhật kết quả sau 5/20/60 ngày cho các dự báo đã đủ tuổi"
    cli: "python ptck.py prediction-registry update"
    category: telemetry

  prediction_registry_stats:
    description: "Xem thống kê lợi nhuận trung bình theo nhóm phân loại (ĐƯỢC XÁC NHẬN / DẪN DẮT ĐƠN ĐỘC / CHƯA ĐỦ DỮ LIỆU)"
    cli: "python ptck.py prediction-registry stats"
    category: telemetry

  prediction_registry_list:
    description: "Xem danh sách các dự báo và kết quả gần nhất"
    cli: "python ptck.py prediction-registry list [--limit N]"
    category: telemetry

  # ── Gap Analyzer ─────────────────────────────────────────
  gap_analyzer:
    description: "Kiểm toán dữ liệu — phát hiện missing symbols/dates, xuất manifest"
    cli: "python ptck.py gap-analyzer [--lookback-months 3] [--output path]"
    category: system

  daily_update_with_manifest:
    description: "Cập nhật dữ liệu EOD kết hợp vá lỗ từ gap-analyzer"
    cli: "python ptck.py daily-update --manifest backend/data/missing_manifest.json"
    category: daily

  # ── SBV Recovery ────────────────────────────────────────
  sbv_update:
    description: "5-step SBV recovery: backup → fixtures → pytest → scrape → clear alert"
    cli: "python ptck.py sbv-update"
    category: recovery

  restore_backup:
    description: "Khôi phục alert + recall_state từ backup gần nhất"
    cli: "python ptck.py restore-backup"
    category: recovery

  clear_crisis:
    description: "Xóa crisis_cooldown + micro_stress gate — reset trạng thái khủng hoảng thủ công"
    cli: "python ptck.py clear-crisis"
    category: recovery

  clear_crisis:
    description: "Xóa crisis_cooldown + micro_stress gate — reset trạng thái khủng hoảng thủ công"
    cli: "python ptck.py clear-crisis"
    category: recovery

  # ── Cleanup ─────────────────────────────────────────────
  cleanup_telemetry:
    description: "Dọn dẹp entropy_log.csv — giữ lại N dòng gần nhất"
    cli: "python ptck.py cleanup telemetry [--max-rows N]"
    category: system

  cleanup_all:
    description: "Dọn dẹp toàn bộ: telemetry + state cache"
    cli: "python ptck.py cleanup all"
    category: system

  # ── Backfill Macro (Hotfix #2) ─────────────────────────
  backfill_macro:
    description: "Backfill 1y historical data cho 4 PTD macro tickers (^GSPC, ^IXIC, ^VIX, ^HSI) — tránh ZeroDivisionError / Singular Matrix do cold start"
    cli: "python ptck.py backfill-macro [--days 252]"
    category: system

  # ── Calendar ────────────────────────────────────────────
  check_calendar:
    description: "Kiểm tra lịch lễ so với timeanddate.com, có flag auto-update"
    cli: "python ptck.py check-calendar [--auto-update]"
    category: system

  # ── Absorption Detector ───────────────────────────────
  absorption_detector:
    description: "Phát hiện Cân bằng Hấp thụ — SDI (Spectral Dominance Index) + Volume Profile PCA + Adaptive HDR unlock"
    cli: "python ptck.py absorption-detector [--date YYYY-MM-DD] [--quiet]"
    category: decision

  # ── Governor Decision Matrix ─────────────────────────
  governor_matrix:
    description: "Bộ não Governor — 4 Layer (Health + Valuation + Behavior + Regime) trên 10 mã mục tiêu"
    cli: "python ptck.py governor [--symbols FPT ACB ...]"
    category: decision

  # ── Volume Spike Watch ───────────────────────────────
  volume_spike_watch:
    description: "Giám sát Volume Spike — phát hiện nến xác nhận cho các mã WAIT, kích hoạt Scale-In"
    cli: "python ptck.py watch [--symbols FPT HPG ...] [--threshold 1.5]"
    category: decision

  # ── MacroStateClassifier (Phase 4 P0) ────────────────
  macro_state:
    description: "MacroStateClassifier — trạng thái vĩ mô thống nhất (7D drivers + discrete label + PTD pipeline)"
    cli: "python ptck.py macro-state [--date YYYY-MM-DD]"
    category: macro

  # ── EconomicTransmissionEngine (Phase 4 P1) ────────────
  transmission:
    description: "Economic Transmission Engine — 3 latent states: Liquidity, Credit, Confidence + transmission phase"
    cli: "python ptck.py transmission"
    category: macro

  # ── SectorStateEngine (Phase 4 P1) ─────────────────────
  sector_rotation:
    description: "Sector State Engine — đánh giá 19 ngành ICB (Momentum+Health+Flow+Valuation) + rotation chain"
    cli: "python ptck.py sector"
    category: macro

  # ── CompanyHealthV2 (Phase 4 P2) ───────────────────────
  health_v2:
    description: "Company Health v2 — 5-organ latent state (Profitability, Cash, Balance Sheet, Efficiency, Moat) + archetype"
    cli: "python ptck.py health-v2 [--symbols FPT VCB ...]"
    category: company

  # ── CSI Explain (Causal DAG Trace) ──────────────────────
  csi_explain:
    description: "CSI Explain — Cây vết truyền dẫn (Causal DAG Trace) từ World FedState xuống điểm CSI doanh nghiệp (Contextual Security Index / Chỉ Số An Toàn Bối Cảnh). Tách Facts vs Surprise + Entropy/Confidence chuỗi. Hỗ trợ so sánh cùng ngành."
    cli: "python ptck.py csi-explain --symbols VCB FPT ... [--sector Banking] [--list-sectors] [--output report|json]"
    category: company

  # ── Governor P3 Bayesian Expected Utility ─────────────
  governor:
    description: "P3 Governor — Bayesian Expected Utility. Weight-of-evidence P0→P2 + Kelly sizing. Thay thế IF/THEN."
    cli: "python ptck.py governor [--symbols FPT VCB ...] [--output json]"
    category: governor

  # ── P4 Calibration (Meta-Cognition) ────────────────────
  calibrate_eval:
    description: "P4 Calibration — evaluate Log-Loss, ECE, MCE on resolved predictions"
    cli: "python ptck.py calibrate eval [--days 90]"
    category: calibration
  calibrate_update_beta:
    description: "P4 Calibration — update Beta posteriors from actual outcomes"
    cli: "python ptck.py calibrate update-beta [--days 90]"
    category: calibration
  calibrate_lrs:
    description: "P4 Calibration — view calibrated Likelihood Ratios"
    cli: "python ptck.py calibrate lrs"
    category: calibration
  calibrate_status:
    description: "P4 Calibration — prediction log status (unresolved vs resolved)"
    cli: "python ptck.py calibrate status [--days 90]"
    category: calibration
  calibrate_resolve:
    description: "P4 Calibration — resolve pending outcomes from future price data"
    cli: "python ptck.py calibrate resolve [--hold-days 30] [--dry-run]"
    category: calibration
  calibrate_report:
    description: "P4 Calibration — trend report (Log-Loss, ECE theo thời gian)"
    cli: "python ptck.py calibrate report [--days 90]"
    category: calibration
  calibrate_circuit_breaker:
    description: "P4 Circuit Breaker — xem trạng thái đóng băng vị thế (auto-check khi degradation)"
    cli: "python ptck.py calibrate circuit-breaker [--force-check]"
    category: calibration

  # ── P5 Counterfactual Reasoning ──────────────────────────
  counterfactual:
    description: "P5 Counterfactual Reasoning — 'What if?' simulation. 6 scenarios: STABLE_MACRO, CREDIT_UNFREEZE, OPTIMISTIC..."
    cli: "python ptck.py counterfactual [--symbols FPT VCB ...]"
    category: reasoning

  # ── LAW-004 Evidence Engine ─────────────────────────────
  evidence_list:
    description: "LAW-004 Evidence Engine — view all evidence nodes (reliability, drift, dynamic weight)"
    cli: "python ptck.py evidence list"
    category: calibration
  evidence_weights:
    description: "LAW-004 Evidence Engine — view current dynamic weights"
    cli: "python ptck.py evidence weights"
    category: calibration
  evidence_drift:
    description: "LAW-004 Evidence Engine — view high-drift (>0.30) nodes"
    cli: "python ptck.py evidence drift"
    category: calibration
  evidence_applicability:
    description: "Sprint 2 Applicability Engine — A_i = f(macro, sector, entropy)"
    cli: "python ptck.py evidence applicability status"
    category: calibration
  evidence_applicability_heatmap:
    description: "Sprint 2 — full macro × node applicability matrix"
    cli: "python ptck.py evidence applicability heatmap"
    category: calibration

  # ── Sprint 3: CausalEdge ────────────────────────────────
  causal_status:
    description: "Sprint 3 CausalEdge — graph statistics (nodes, edges, avg confidence)"
    cli: "python ptck.py causal status"
    category: calibration
  causal_propagate:
    description: "Sprint 3 — propagate signal through causal DAG"
    cli: "python ptck.py causal propagate --source CREDIT_STRESS --archetype COMPOUNDER"
    category: calibration
  causal_trace:
    description: "Sprint 3 — trace highest-confidence path from source to target"
    cli: "python ptck.py causal trace CREDIT_STRESS IT_BACKLOG --archetype COMPOUNDER"
    category: calibration
  causal_edges:
    description: "Sprint 3 — list all registered causal edges"
    cli: "python ptck.py causal edges"
    category: calibration

  # ── Giai đoạn 1: Business Ontology Layer ────────────────
  business_archetype:
    description: "Giai đoạn 1 — Business Archetype: DNA classification (8 archetypes: COMPOUNDER, CYCLICAL_HEAVY, FRANCHISE_BANK, ...)"
    cli: "python ptck.py archetype [--symbols FPT VCB ...]"
    category: business
  economic_engine:
    description: "Giai đoạn 1 — Economic Engine: causal chain from macro driver to financial impact"
    cli: "python ptck.py economic-engine [--symbols FPT VCB ...] [--driver STEEL_PRICE]"
    category: business
  competitive_position:
    description: "Giai đoạn 1 — Competitive Position: moat assessment (7 pillars) + market power"
    cli: "python ptck.py competitive [--symbols FPT VCB ...]"
    category: business

  # ── Giai đoạn 2: Factor Exposure Matrix ──────────────
  factor_exposure:
    description: "Giai đoạn 2 — Factor Exposure Matrix: độ nhạy cảm macro từng symbol (7 nhóm yếu tố × 26 factor)"
    cli: "python ptck.py factor-exposure [--symbols FPT VCB ...] [--top N]"
    category: business
  factor_exposure_query:
    description: "Tra cứu exposure của 1 factor cụ thể cho symbol (VD: INTEREST_RATE)"
    cli: "python ptck.py factor-exposure --query INTEREST_RATE --symbols FPT HPG"
    category: business
  factor_exposure_lr_adjust:
    description: "Tính LR adjustment từ factor exposure cho macro state hiện tại"
    cli: "python ptck.py factor-exposure --lr-adjust [--symbols FPT VCB ...]"
    category: business

  # ── Giai đoạn 2: Vietnamese CLI alias ────────────────
  pho_nhiem:
    description: "(Giai đoạn 2) Phơi nhiễm yếu tố vĩ mô — Factor Exposure Matrix, tiếng Việt"
    cli: "python ptck.py pho-nhiem [--symbols FPT VCB ...] [--top N]"
    category: business
  pho_nhiem_query:
    description: "Tra cứu phơi nhiễm 1 yếu tố cụ thể"
    cli: "python ptck.py pho-nhiem --query INTEREST_RATE --symbols FPT HPG"
    category: business

  # ── Giai đoạn 3: Contextualized Company Health ──────
  contextual_health:
    description: "Giai đoạn 3 — Contextualized Company Health: ngưỡng tài chính động theo Archetype (thay static limits)"
    cli: "python ptck.py contextual-health [--symbols FPT VCB ...]"
    category: business
  suc_khoe_doanh_nghiep:
    description: "(Giai đoạn 3) Sức khỏe doanh nghiệp theo ngữ cảnh — tiếng Việt"
    cli: "python ptck.py suc-khoe-doanh-nghiep [--symbols FPT VCB ...]"
    category: business

  # ── Giai đoạn 2: Company Health Engine ──────────────
  health_engine:
    description: "Giai đoạn 2 — compute health_ratios từ financial_facts. Bước bắt buộc giữa cafef-crawl (nạp facts) và health-v2 (đọc ratios). Thiếu bước này → mã mới (VD BCM) bị NO DATA."
    cli: "python ptck.py health-engine compute --symbols BCM"
    category: business

  # ── Giai đoạn 4: Capital Allocation Quality ──────────
  capital_allocation:
    description: "Giai đoạn 4 — Capital Allocation Quality: ROIC vs WACC, reinvestment efficiency, shareholder returns"
    cli: "python ptck.py capital-allocation [--symbols FPT VCB ...]"
    category: business
  phan_bo_von:
    description: "(Giai đoạn 4) Chất lượng phân bổ vốn — tiếng Việt"
    cli: "python ptck.py phan-bo-von [--symbols FPT VCB ...]"
    category: business

  # ── Drift & Validation Layer ─────────────────────────
  drift:
    description: "Drift & Validation Layer — tự đánh giá độ tin cậy toàn bộ hệ thống"
    cli: "python ptck.py drift {all|concept|generalization|surprise|model}"
    category: validation
    subcommands:
      drift_all:
        description: "Toàn cảnh drift: concept + generalization + CB + driver"
        cli: "python ptck.py drift all [--days 90]"
      drift_concept:
        description: "Concept Drift — calibration trend (Log-Loss degradation)"
        cli: "python ptck.py drift concept [--days 90]"
      drift_generalization:
        description: "Generalization Gap — live Sharpe vs random baseline"
        cli: "python ptck.py drift generalization"
      drift_surprise:
        description: "Surprise Engine — phát hiện cặp (driver, outcome) bất thường"
        cli: "python ptck.py drift surprise"
      drift_model:
        description: "Model Evidence & Retirement — đánh giá tuổi thọ mô hình"
        cli: "python ptck.py drift model"

  # ── Governor Report ──────────────────────────────────
  governor_report:
    description: "Phân rã đóng góp 3 mô hình (Macro/Quant/Regime) vào position_level của DecisionGuard"
    cli: "python ptck.py governor-report"
    category: risk

  # ── ERL Scan ─────────────────────────────────────────
  erl_scan:
    description: "Entity Resilience Layer — quét sức khỏe 1.514 mã (Phase 1: Proxy BCTC)"
    cli: "python ptck.py erl-scan [--top N] [--vn30] [--date YYYY-MM-DD]"
    category: risk

  # ── Sprint 4: ModelRegistry ─────────────────────────────
  model_registry_status:
    description: "Sprint 4 ModelRegistry — xem trạng thái 3 mô hình cạnh tranh + BMA weights"
    cli: "python ptck.py model-registry status"
    category: calibration
  model_registry_select:
    description: "Sprint 4 — chọn mô hình tốt nhất cho bối cảnh hiện tại"
    cli: "python ptck.py model-registry select"
    category: calibration
  model_registry_activate:
    description: "Sprint 4 — kích hoạt mô hình (ACTIVE)"
    cli: "python ptck.py model-registry activate M1_MACRO [--reason ...]"
    category: calibration
  model_registry_suspend:
    description: "Sprint 4 — tạm ngưng mô hình (DORMANT)"
    cli: "python ptck.py model-registry suspend M1_MACRO [--reason ...]"
    category: calibration
  model_registry_retire:
    description: "Sprint 4 — đào thải mô hình (RETIRED)"
    cli: "python ptck.py model-registry retire M1_MACRO [--reason ...]"
    category: calibration
  model_registry_revive:
    description: "Sprint 4 — phục hồi mô hình (RETIRED→ACTIVE)"
    cli: "python ptck.py model-registry revive M1_MACRO [--reason ...]"
    category: calibration
  model_registry_history:
    description: "Sprint 4 — xem lịch sử chuyển trạng thái mô hình"
    cli: "python ptck.py model-registry history M1_MACRO"
    category: calibration
  model_registry_bma:
    description: "Sprint 4 — xem BMA weights cho bối cảnh hiện tại"
    cli: "python ptck.py model-registry bma"
    category: calibration

  # ── fetch-financials ─────────────────────────────────
  fetch_financials:
    description: "Fetch PE/PB/PS/EV-EBITDA từ VCI, compute cross-sectional z-scores, seed valuation_scores"
    cli: "python ptck.py fetch-financials --symbols FPT ACB HDB [--all]"
    category: data

  # ── import-financials ────────────────────────────────
  import_financials:
    description: "Import PE/PB/EV-EBITDA/ROE/EPS từ CSV/XLSX, compute z-scores, seed valuation_scores"
    cli: "python ptck.py import-financials --file data.csv [--sheet Sheet1]"
    category: data

  # ── bctc-20q ─────────────────────────────────────────
  bctc_20q:
    description: "Import 20-quarter BCTC CSV, compute time-series z-scores (intrinsic valuation vs 5-year history)"
    cli: "python ptck.py bctc-20q --file 20q.csv [--sheet Sheet1]"
    category: data

  # ── fetch-macro ───────────────────────────────────────
  fetch_macro:
    description: "Fetch world macro data (Fed rate, FOMC dissent, QT balance, US10Y, USD, Brent) + VGB 10Y"
    cli: "python ptck.py fetch-macro [--force] [--skip-vgb]"
    category: data

  # ── cafef-crawl ────────────────────────────────────────
  cafef_crawl:
    description: "Crawl BCTC 20 quarters — nạp vào financial_facts.db. source=api dùng REST JSON bridges (VNDirect Fininfo → TCBS FinAPI → CafeF Bank API → Vietstock summary). source=vietstock = Vietstock Finance free: financeinfo 4 quý (17 rows) + BCTT 9 quý (46 norms: CASH_EQUIV, RECEIVABLES, INVENTORY, LONG_TERM_DEBT, COGS...), merge tự động"
    cli: "python ptck.py cafef-crawl [--symbols FPT ACB ...] [--type STANDARD|BANK] [--source vci|api|vietstock|cafef|synthetic] [--playwright] [--delay SECONDS]"
    category: data

  # ── vgb10y ─────────────────────────────────────────────
  vgb10y:
    description: "Seed VGB 10Y yield từ World Bank API — ghi REAL vào macro_history"
    cli: "python ptck.py vgb10y"
    category: data

  # ── financial-search ──────────────────────────────────
  financial_search:
    description: "Tra cứu dữ liệu tài chính từ financial_facts.db — filter theo symbol/metric/period/source"
    cli: "python ptck.py financial-search [--symbol VCB] [--metric REVENUE] [--period 2026Q1] [--source cafef] [--min-value 1000] [--max-value 100000]"
    category: data

  # ── init-agent ────────────────────────────────────────
  init_agent:
    description: "Initialize IDE agent config files (.clinerules + .cursorrules) from bundled AGENTS.md"
    cli: "python ptck.py init-agent"
    category: system
