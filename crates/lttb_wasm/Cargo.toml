[package]
name = "lttb_wasm"
version = "0.1.0"
edition = "2021"
description = "LTTB downsampling for PTCK charts — Rust → WASM (60 FPS)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
# [WHY] Tràn số phải panic thay vì wrap im lặng: chỉ số bucket được tính từ f64 → usize, một
# lần wrap cho ra index "hợp lệ" nhưng sai (vẽ sai điểm, im lặng). Chi phí không đáng kể.
overflow-checks = true
