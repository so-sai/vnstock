[package]
name = "app"
version = "0.1.0"
description = "PTCK_VN Command Center"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
chrono = "0.4"

[features]
custom-protocol = [ "tauri/custom-protocol" ]
