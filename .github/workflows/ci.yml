# ==============================================================================
# ci.yml — GitHub Actions (CI/CD Layer 2)
#
# WHY: git-local hook (Layer 1) chỉ chạy trên máy dev. Lớp CI này chạy trên mỗi
# push / pull_request — rào chắn static analysis + test suite được thực thi độc
# lập với máy dev, chặn mọi commit lọt lưới hook cục bộ (vd ai đó --no-verify,
# hoặc clone mà không cài pre-commit). 
#
#   - Job `lint`:    ruff check + ruff format --check (khớp .pre-commit-config.yaml)
#   - Job `test`:    pytest toàn suite backend
#   - Job `quant-gate`: Scoped Warning Gate (Layer 3) — pytest -W error::FutureWarning
#     chỉ trên phân hệ quant, để API pandas/… bị deprecate BẮT BUỘC fail CI trước
#     khi merge, mà không bị nhiễu bởi warning thư viện ngoài ở module khác.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Static Analysis (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install ruff
        run: pip install ruff==0.15.10
      - name: Ruff check (backend)
        run: ruff check --config backend/pyproject.toml backend
      - name: Ruff format check (backend)
        run: ruff format --check --config backend/pyproject.toml backend

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install backend deps
        run: |
          cd backend
          pip install -e .[test]
      - name: Pytest (backend)
        run: |
          cd backend
          python -m pytest tests -q | tee pytest_output.txt
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: backend/pytest_output.txt
        continue-on-error: true

  quant-gate:
    name: Scoped Warning Gate (quant)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install backend deps
        run: |
          cd backend
          pip install -e .[test]
      - name: Pytest quant with FutureWarning as error
        run: |
          cd backend
          python -m pytest tests/test_vn20_quant_filter.py \
            -q -W error::FutureWarning -p no:cacheprovider
