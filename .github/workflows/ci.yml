# ==============================================================================
# ci.yml — GitHub Actions (CI/CD Layer 2)
#
# WHY: git-local hook (Layer 1) chỉ chạy trên máy dev. Lớp CI này chạy trên mỗi
# push / pull_request — rào chắn static analysis + test suite được thực thi độc
# lập với máy dev, chặn mọi commit lọt lưới hook cục bộ (vd ai đó --no-verify,
# hoặc clone mà không cài pre-commit). 
#
#   - Job `lint`:    ruff check + ruff format --check (khớp .pre-commit-config.yaml)
#   - Job `unsafe-guard`: chặn `unsafe` MỚI ngoài allowlist + bắt buộc 2 crate kernel còn
#     `#![forbid(unsafe_code)]` (Lớp-2 bù cho Win32/Tauri không thể forbid).
#   - Job `rust-static`: cargo clippy -D warnings (ptck_core + lttb_wasm/wasm32) + unit test
#     host của lttb_wasm. Trước 09/11/2026 Rust KHÔNG có lưới CI nào.
#   - Job `deps-audit`: cargo audit (3 lockfile) + pip-audit (backend/requirements.txt).
#   - Job `test`:    pytest toàn suite backend
#   - Job `quant-gate`: Scoped Warning Gate (Layer 3) — pytest -W error::FutureWarning
#     chỉ trên phân hệ quant, để API pandas/… bị deprecate BẮT BUỘC fail CI trước
#     khi merge, mà không bị nhiễu bởi warning thư viện ngoài ở module khác.
# ==============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Static Analysis (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install ruff
        run: pip install ruff==0.15.10
      - name: Ruff check (backend/src)
        run: ruff check --config backend/pyproject.toml backend/src
      - name: Ruff format check (backend/src)
        run: ruff format --check --config backend/pyproject.toml backend/src
      - name: Dangling import check (AST)
        run: |
          # backend/pyproject.toml đặt addopts "--timeout=300" nên BẮT BUỘC có
          # plugin pytest-timeout, nếu không pytest sẽ fail "unrecognized arguments".
          pip install pytest pytest-timeout
          cd backend
          python -m pytest tests/test_dangling_imports.py -q -p no:cacheprovider

  unsafe-guard:
    name: Rust unsafe allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Guard — no new unsafe outside allowlist
        run: python scripts/check_unsafe_allowlist.py

  rust-static:
    name: Rust clippy + kernel tests
    runs-on: ubuntu-latest
    env:
      # [WHY] pyo3 0.23 chỉ chính thức hỗ trợ tới Python 3.13; CI dùng 3.12 để không phải
      # dựa vào cờ forward-compat. Trên máy dev Python 3.14 vẫn build được nhờ cờ này.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clippy ptck_core (all targets, -D warnings)
        run: cargo clippy --manifest-path backend/crates/ptck_core/Cargo.toml --all-targets -- -D warnings
      - name: Unit test lttb_wasm (host target)
        run: cargo test --manifest-path crates/lttb_wasm/Cargo.toml
      - name: Clippy lttb_wasm (wasm32, -D warnings)
        run: cargo clippy --manifest-path crates/lttb_wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  deps-audit:
    name: Dependency audit (RustSec + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          # [WHY] pip-audit đọc metadata của pip/packaging; chạy trên 3.12 là bản ổn định
          # nhất, tránh việc công cụ audit tự đỏ vì Python 3.14 chưa được hỗ trợ — audit
          # phải đỏ khi CÓ advisory, không phải khi tool chưa kịp cập nhật.
          python-version: "3.12"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit — 3 lockfile (root, ptck_core, lttb_wasm)
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file backend/crates/ptck_core/Cargo.lock
          cargo audit --file crates/lttb_wasm/Cargo.lock
      - name: pip-audit — backend requirements
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: lint
    # Test Contract 1 (Determinism Guard): hash seed ngẫu nhiên mỗi lần chạy CI
    # để bắt sớm mọi nondeterminism do thứ tự set/dict (như lỗi UNIVERSE=list(set())).
    env:
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install backend deps
        run: |
          cd backend
          pip install -e .[test]
      - name: Pytest (backend)
        run: |
          cd backend
          python -m pytest tests -q | tee pytest_output.txt
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: backend/pytest_output.txt
          retention-days: 7
        continue-on-error: true

  quant-gate:
    name: Scoped Warning Gate (quant)
    runs-on: ubuntu-latest
    needs: lint
    env:
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "backend/pyproject.toml"
      - name: Install backend deps
        run: |
          cd backend
          pip install -e .[test]
      - name: Pytest quant with FutureWarning as error
        run: |
          cd backend
          python -m pytest tests/test_vn20_quant_filter.py \
            -q -W error::FutureWarning -p no:cacheprovider
